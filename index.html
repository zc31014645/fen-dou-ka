<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf6ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171410" media="(prefers-color-scheme: dark)" />
    <!-- Packaged-app hints: this single file is the whole app (no server,
         no build step), so it can be wrapped as-is by Capacitor/Cordova
         for iOS/Android, or installed from a browser. All data lives in
         this device's local storage under one key. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="奮鬥卡" />
    <link rel="icon" href="data:," />
    <title>新奮鬥卡開發 HTML5</title>
    <style>
      /* 字體大小 support is structural: every size in the app is in rem,
         and the root font size is the single knob they all hang off —
         html { font-size: calc(16px * var(--font-scale)) }. The app sets
         --font-scale on <html> from the saved profile level (0.9–1.5),
         so all text, spacing and tap targets scale together. The paper
         card (.print-card) uses fixed px and never scales. */
      :root {
        color-scheme: light dark;
        font-size: calc(16px * var(--font-scale, 1));
        --bg: #faf6ee;
        --surface: #fffdf7;
        --text: #26221c;
        --dim: #7a6f5c;
        --border: #ddd2bd;
        --accent: #b3352b;
        --accent-ink: #b3352b;
        --gold: #a97e2f;
        --green: #059669;
        --saved: #047857;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171410;
          --surface: #221e18;
          --text: #f0e9db;
          --dim: #a89a83;
          --border: #3a332a;
          --accent: #e0655a;
          --gold: #c9a24d;
          --saved: #34d399;
        }
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      .font-display { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif; }

      /* Phone tap targets: at least 32px tall. */
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2rem; }
      button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
      input, textarea, select { font: inherit; }
      button:disabled { cursor: default; }

      .wrap { margin: 0 auto; width: 100%; max-width: 48rem; padding: 0 1rem 2.5rem; }

      /* ---- banner ---- */
      .banner {
        margin-top: 0.75rem; border: 1px solid var(--gold); border-radius: 0.5rem;
        background: color-mix(in srgb, var(--gold) 10%, transparent);
        padding: 0.625rem 0.75rem; font-size: 0.875rem; line-height: 1.5;
      }
      .banner button { font-weight: 700; color: var(--accent); text-decoration: underline; margin-left: 0.5rem; min-height: 2rem; }

      /* ---- hero ---- */
      .hero { margin-top: 1.25rem; }
      .hero-date { font-size: 0.875rem; color: var(--dim); margin: 0; }
      .hero-row { margin-top: 0.25rem; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 0.75rem; }
      .hero h1 { font-size: 2.25rem; line-height: 2.5rem; font-weight: 900; margin: 0; }
      .streak { font-size: 0.875rem; color: var(--dim); margin: 0; }
      .streak b { font-size: 1.125rem; color: var(--accent); }
      .hero-summary { margin: 0.75rem 0 0; font-size: 0.875rem; }

      /* ---- buttons ---- */
      .btn-accent { background: var(--accent-ink); color: #fff; border-radius: 0.5rem; padding: 0.75rem 1.25rem; font-size: 1rem; font-weight: 700; }
      .btn-accent-sm { border: 1px solid var(--accent); color: var(--accent); border-radius: 0.5rem; padding: 0.5rem 1rem; font-size: 0.875rem; font-weight: 700; }
      .btn-accent:disabled, .btn-outline-accent:disabled { opacity: 0.5; }
      .btn-outline-accent { border: 1px solid var(--accent); color: var(--accent); border-radius: 0.5rem; padding: 0.75rem 1.25rem; font-size: 1rem; font-weight: 700; }
      .btn-ghost { border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.5rem 1rem; font-size: 0.875rem; }
      .btn-ghost-lg { border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.75rem 1.25rem; font-size: 1rem; }

      /* ---- tabs (segmented control) ---- */
      .tabs {
        margin-top: 1.5rem; display: flex; gap: 0.25rem;
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 0.75rem; padding: 0.25rem;
      }
      .tabs button {
        flex: 1; padding: 0.625rem 1rem; font-size: 1rem; font-weight: 600;
        color: var(--dim); border-radius: 0.5rem; text-align: center;
      }
      .tabs button[aria-current="page"] { background: var(--accent-ink); color: #fff; }

      main { margin-top: 1rem; }
      .loading { padding: 2.5rem 0; text-align: center; color: var(--dim); }
      .load-error { padding: 2.5rem 0; text-align: center; color: var(--accent); }

      /* ---- calendar toolbar ---- */
      .cal-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
      .seg { display: flex; overflow: hidden; border: 1px solid var(--border); border-radius: 0.5rem; }
      .seg button { padding: 0.5rem 1rem; font-size: 0.875rem; font-weight: 600; min-height: 2.25rem; }
      .seg button[aria-pressed="true"] { background: var(--accent-ink); color: #fff; }
      .cal-title { font-size: 1.125rem; font-weight: 700; margin: 0; }
      .cal-navrow { display: flex; align-items: center; gap: 0.75rem; flex: 1 1 100%; }
      .cal-nav { margin-left: auto; display: flex; gap: 0.375rem; }
      .cal-nav button { border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.5rem 0.75rem; font-size: 0.875rem; min-height: 2.25rem; }
      .cal-hint { margin: 0.75rem 0 0; font-size: 0.875rem; color: var(--dim); line-height: 1.5; }

      /* ---- month grid ---- */
      .dow { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 0.75rem; color: var(--dim); }
      .dow div { padding: 0.25rem 0; }
      .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.25rem; }
      .cell {
        display: flex; flex-direction: column; align-items: center; min-height: 4rem;
        border-radius: 0.625rem; border: 1px solid var(--border);
        background: color-mix(in srgb, var(--surface) 65%, var(--bg));
        padding: 0.375rem 0.125rem; width: 100%;
      }
      .cell:active, .cell.filled:active, .cell.today:active { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); border-color: var(--accent); }
      @media (hover: hover) { .cell:hover { border-color: var(--accent); } }
      .cell.filled { border-color: var(--border); background: var(--surface); }
      .cell.today { border: 2px solid var(--accent); background: var(--surface); }
      .cell .dnum { font-size: 1rem; font-weight: 600; line-height: 1; color: var(--dim); }
      .cell.filled .dnum, .cell.today .dnum { color: var(--text); }
      .cell .lunar { margin-top: 0.125rem; font-size: 0.625rem; line-height: 1; color: var(--dim); }
      .badges { margin-top: 0.125rem; display: flex; align-items: center; justify-content: center; gap: 0.25rem; min-height: 0.375rem; }
      .dot { display: inline-block; width: 0.375rem; height: 0.375rem; border-radius: 9999px; }
      .dot.green { background: var(--green); }
      .dot.gold { background: var(--gold); }
      .badges .total { font-size: 0.625rem; font-weight: 600; color: var(--gold); }
      .shou {
        margin-top: 0.125rem; display: inline-flex; width: 1rem; height: 1rem; flex-shrink: 0;
        align-items: center; justify-content: center; border-radius: 0.25rem;
        background: var(--accent-ink); color: #fff; font-size: 0.625rem; font-weight: 700; line-height: 1;
      }
      .cell .items-line { margin-top: 0.125rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.625rem; line-height: 1.25; color: var(--dim); }
      .cal-foot { margin-top: 1rem; font-size: 0.875rem; color: var(--dim); }
      .cal-legend { margin-top: 0.25rem; font-size: 0.75rem; color: var(--dim); }

      /* ---- day list ---- */
      .daylist { display: flex; flex-direction: column; gap: 0.375rem; }
      .dayrow {
        display: flex; align-items: center; gap: 0.75rem; width: 100%; text-align: left;
        border: 1px solid var(--border); background: var(--surface); border-radius: 0.5rem; padding: 0.625rem 0.75rem;
      }
      .dayrow.today { border: 2px solid var(--accent); }
      .dayrow:active { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); border-color: var(--accent); }
      @media (hover: hover) { .dayrow:hover { border-color: var(--accent); } }
      .dayrow .d1 { width: 3.5rem; flex-shrink: 0; }
      .dayrow .d1 b { display: block; font-size: 1rem; font-weight: 600; }
      .dayrow .d1 span { display: block; font-size: 0.75rem; color: var(--dim); }
      .dayrow .d2 { width: 4rem; flex-shrink: 0; font-size: 0.75rem; color: var(--dim); }
      .dayrow .d3 { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.875rem; }
      .dayrow .d3 .total-inline { font-weight: 600; color: var(--gold); }
      .dayrow .badges { margin-top: 0; }

      /* ---- cards / sections ---- */
      .card { border: 1px solid var(--border); background: var(--surface); border-radius: 0.5rem; padding: 1rem; }
      .card h2 { font-size: 1.125rem; font-weight: 700; margin: 0; }
      .card .hint { margin-top: 0.25rem; font-size: 0.875rem; color: var(--dim); line-height: 1.5; }
      .stack { display: flex; flex-direction: column; gap: 1.5rem; }
      .field label { display: block; font-size: 0.875rem; color: var(--dim); }
      .field input[type="text"], .field input:not([type]) {
        margin-top: 0.25rem; width: 100%; border: 1px solid var(--border); background: var(--bg);
        border-radius: 0.5rem; padding: 0.5rem 0.75rem; font-size: 1rem; color: var(--text);
      }
      .profile-grid { margin-top: 0.75rem; display: grid; grid-template-columns: 1fr; gap: 0.75rem; }
      @media (min-width: 640px) { .profile-grid { grid-template-columns: repeat(3, 1fr); } }
      .radio-col { margin-top: 0.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
      .radio-row { display: flex; align-items: flex-start; gap: 0.5rem; font-size: 0.875rem; cursor: pointer; padding: 0.25rem 0; }
      .radio-row input { margin-top: 0.25rem; width: 1rem; height: 1rem; accent-color: #b3352b; flex-shrink: 0; }
      fieldset { border: none; margin: 0; padding: 0; }
      fieldset legend { font-size: 0.875rem; color: var(--dim); padding: 0; }
      .saved-note { font-size: 0.875rem; color: var(--saved); }
      .err { font-size: 0.875rem; color: var(--accent); }

      /* ---- font size setting ---- */
      .font-row { margin-top: 0.75rem; display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
      .font-btn {
        display: flex; width: 3.5rem; height: 3.5rem; flex-shrink: 0; align-items: center; justify-content: center;
        border-radius: 9999px; border: 2px solid var(--border); background: var(--bg);
        font-size: 1.875rem; font-weight: 700; line-height: 1;
      }
      .font-btn:disabled { opacity: 0.3; }
      .font-cur { min-width: 0; flex: 1; text-align: center; margin: 0; }
      .font-cur b { display: block; font-size: 1.5rem; font-weight: 700; }
      .font-cur span { display: block; font-size: 0.875rem; color: var(--dim); }

      /* ---- reflection settings ---- */
      .refl-list { margin-top: 0.5rem; list-style: none; padding: 0; }
      .refl-list li { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; padding: 0.5rem 0; border-top: 1px solid var(--border); }
      .refl-list li:first-child { border-top: none; }
      .refl-list input {
        min-width: 0; flex: 1; border: 1px solid var(--border); background: var(--bg);
        border-radius: 0.5rem; padding: 0.5rem 0.75rem; font-size: 1rem; color: var(--text);
      }
      .btn-sm { border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.5rem 0.75rem; font-size: 0.875rem; font-weight: 600; }
      .btn-sm:disabled { opacity: 0.4; }
      .btn-danger-sm { background: var(--accent-ink); color: #fff; border-radius: 0.5rem; padding: 0.5rem 0.75rem; font-size: 0.875rem; font-weight: 700; }
      .add-row { margin-top: 0.75rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
      .add-row input {
        min-width: 0; flex: 1; border: 1px solid var(--border); background: var(--bg);
        border-radius: 0.5rem; padding: 0.5rem 0.75rem; font-size: 1rem; color: var(--text);
      }
      .btn-add { background: var(--accent-ink); color: #fff; border-radius: 0.5rem; padding: 0.625rem 1rem; font-size: 1rem; font-weight: 700; }
      .btn-add:disabled { opacity: 0.5; }

      /* ---- snapshots ---- */
      .snap-list { margin-top: 0.5rem; list-style: none; padding: 0; }
      .snap-list li { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; padding: 0.625rem 0; border-top: 1px solid var(--border); }
      .snap-list li:first-child { border-top: none; }
      .snap-info { min-width: 0; flex: 1; }
      .snap-info b { display: block; font-size: 1rem; font-weight: 400; }
      .snap-info span { display: block; font-size: 0.75rem; color: var(--dim); }

      /* ---- birthday list (settings) ---- */
      .bday-month { margin-top: 1rem; }
      .bday-month h3 { font-size: 1rem; font-weight: 700; margin: 0; }
      .bday-month ul { margin-top: 0.25rem; list-style: none; padding: 0; }
      .bday-month li { padding: 0.5rem 0; border-top: 1px solid var(--border); }
      .bday-month li:first-child { border-top: none; }
      .bday-month .bd-date { font-size: 0.875rem; font-weight: 600; margin: 0; }
      .bday-month .bd-date span { margin-left: 0.5rem; font-weight: 400; color: var(--dim); }
      .bday-month .bd-occ { margin: 0.125rem 0 0; font-size: 0.875rem; line-height: 1.5; }

      /* ---- report ---- */
      .report-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
      .report-tools label { font-size: 0.875rem; color: var(--dim); }
      .report-tools select { border: 1px solid var(--border); background: var(--surface); border-radius: 0.5rem; padding: 0.375rem 0.5rem; color: var(--text); }
      .report-tools .btn-accent { margin-left: auto; padding: 0.5rem 1rem; font-size: 0.875rem; }
      .stat-grid { margin-top: 1rem; display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; }
      @media (min-width: 640px) { .stat-grid { grid-template-columns: repeat(4, 1fr); } }
      .stat { border: 1px solid var(--border); background: var(--surface); border-radius: 0.5rem; padding: 0.625rem 0.75rem; }
      .stat p { margin: 0; }
      .stat .sl { font-size: 0.75rem; color: var(--dim); }
      .stat .sv { font-size: 1.25rem; font-weight: 700; margin-top: 0.125rem; }
      .tally { margin-top: 1rem; border: 1px solid var(--border); background: var(--surface); border-radius: 0.5rem; padding: 0.75rem; }
      .tally > p.title { font-size: 0.875rem; font-weight: 500; margin: 0; }
      .tally-grid { margin-top: 0.5rem; display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.25rem 1rem; }
      @media (min-width: 640px) { .tally-grid { grid-template-columns: repeat(3, 1fr); } }
      .tally-grid p { display: flex; justify-content: space-between; font-size: 0.875rem; margin: 0; }
      .tally-grid p b { font-weight: 600; color: var(--accent); }
      .tally .sit-line { margin-top: 0.75rem; font-size: 0.875rem; }
      .tally .sit-line b { font-weight: 600; color: var(--accent); }
      .report-note { margin-top: 1rem; font-size: 0.875rem; color: var(--dim); line-height: 1.5; }
      .card-scroll { margin-top: 0.5rem; overflow-x: auto; border: 1px solid var(--border); border-radius: 0.5rem; }
      .card-scroll > div { min-width: 1060px; }

      /* ---- print preview ---- */
      .pp-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; padding-top: 1rem; }
      .pp-title { font-size: 1.125rem; font-weight: 700; margin: 0; }
      .pp-desc { margin-top: 0.75rem; font-size: 0.875rem; line-height: 1.5; color: var(--dim); }
      .pp-actions { margin-top: 0.75rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
      .btn-share { display: inline-flex; align-items: center; gap: 0.5rem; }
      .btn-share svg { width: 1.3rem; height: 1.3rem; flex-shrink: 0; }
      .pp-share-note { margin-top: 0.75rem; border: 1px solid var(--gold); border-radius: 0.5rem; background: color-mix(in srgb, var(--gold) 10%, transparent); padding: 0.625rem 0.75rem; font-size: 0.875rem; line-height: 1.5; }
      .pp-cardwrap { overflow-x: auto; padding: 0 0.5rem 1.5rem; }
      .pp-cardwrap > div { margin: 0 auto; min-width: 1060px; max-width: 72rem; }

      /* ---- modal panel ---- */
      .overlay {
        position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center;
        background: rgba(0, 0, 0, 0.5);
      }
      @media (min-width: 640px) { .overlay { align-items: center; } }
      .panel {
        display: flex; max-height: 92vh; width: 100%; max-width: 32rem; flex-direction: column;
        border-radius: 1rem 1rem 0 0; background: var(--bg);
      }
      @media (min-width: 640px) { .panel { border-radius: 1rem; } }
      .panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; padding: 1rem 1rem 0; }
      .panel-head h2 { font-size: 1.5rem; font-weight: 700; margin: 0; }
      .panel-head .lunar-line { margin-top: 0.125rem; font-size: 0.875rem; color: var(--dim); }
      .close-x { border: 1px solid var(--border); border-radius: 9999px; padding: 0.25rem 0.75rem; font-size: 1.125rem; line-height: 1; min-height: 2.25rem; }
      .panel-bday { padding: 0.75rem 1rem 0; }
      .bday-btn {
        width: 100%; border: 1px solid var(--accent); color: var(--accent);
        background: color-mix(in srgb, var(--accent) 8%, transparent);
        border-radius: 0.5rem; padding: 0.625rem 1rem; font-size: 1rem; font-weight: 700;
      }
      .panel-body { overflow-y: auto; padding: 0 1rem 0.5rem; }
      .panel-body fieldset { margin-top: 1.5rem; }
      .panel-body fieldset.first { margin-top: 1rem; }
      .panel-body legend { font-size: 1rem; font-weight: 700; color: var(--text); font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif; }
      .panel-body .sub { margin-top: 0.25rem; font-size: 0.75rem; color: var(--dim); }
      .item-list { margin-top: 0.5rem; display: grid; grid-template-columns: 1fr; gap: 0.375rem; }
      .item-row {
        display: flex; cursor: pointer; align-items: center; gap: 0.75rem;
        border: 1px solid var(--border); background: var(--surface); border-radius: 0.5rem; padding: 0.625rem 0.75rem;
        min-height: 2.75rem;
      }
      .item-row.checked { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
      .item-row input { width: 1.25rem; height: 1.25rem; flex-shrink: 0; accent-color: #b3352b; }
      .item-row .num { width: 1.75rem; flex-shrink: 0; text-align: center; font-size: 1rem; font-weight: 700; color: var(--accent); }
      .item-row .nm { font-size: 1rem; }
      .note-field { margin-top: 1rem; }
      .note-field label { font-size: 0.875rem; font-weight: 500; }
      textarea, .text-input {
        margin-top: 0.25rem; width: 100%; border: 1px solid var(--border); background: var(--surface);
        border-radius: 0.5rem; padding: 0.5rem 0.75rem; font-size: 1rem; color: var(--text);
      }
      .stepper { margin-top: 0.5rem; display: grid; grid-template-columns: 1fr; gap: 1rem; }
      .stepper label { font-size: 0.875rem; font-weight: 500; }
      .stepper .row { margin-top: 0.25rem; display: flex; flex-wrap: wrap; align-items: stretch; gap: 0.5rem; }
      .stepper input {
        width: 100%; min-width: 5.5rem; flex: 1; border: 1px solid var(--border); background: var(--surface);
        border-radius: 0.5rem; padding: 0.5rem 0.75rem; font-size: 1.125rem; color: var(--text);
      }
      .stepper .add-btn { flex-shrink: 0; border: 1px solid var(--border); border-radius: 0.5rem; padding: 0 0.75rem; font-size: 0.875rem; font-weight: 600; color: var(--accent); }
      .stepper .clear-btn { flex-shrink: 0; border: 1px solid var(--border); border-radius: 0.5rem; padding: 0 0.75rem; font-size: 0.875rem; color: var(--dim); }
      .classic-list { margin-top: 0.5rem; display: flex; flex-direction: column; gap: 0.375rem; }
      .classic-row {
        display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem;
        border: 1px solid var(--border); background: var(--surface); border-radius: 0.5rem; padding: 0.5rem 0.75rem;
      }
      .classic-row .cname { min-width: 6rem; flex: 1; font-size: 1rem; }
      .classic-row .cbtn { width: 2.25rem; height: 2.25rem; flex-shrink: 0; border: 1px solid var(--border); border-radius: 0.5rem; font-size: 1.125rem; font-weight: 700; }
      .classic-row .cbtn.plus { color: var(--accent); }
      .classic-row .cbtn:disabled { opacity: 0.4; }
      .classic-row .cval { width: 2.5rem; flex-shrink: 0; text-align: center; font-size: 1.125rem; font-weight: 700; }
      .classic-row .cclear { flex-shrink: 0; border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.375rem 0.625rem; font-size: 0.875rem; color: var(--dim); }
      .classic-row .cclear:disabled { opacity: 0.4; }
      .sit-list { margin-top: 0.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
      .sit-row2 { display: flex; align-items: center; gap: 0.75rem; }
      .sit-row2 label { width: 4.5rem; flex-shrink: 0; font-size: 1rem; font-weight: 500; }
      .sit-row2 input {
        min-width: 0; flex: 1; border: 1px solid var(--border); background: var(--surface);
        border-radius: 0.5rem; padding: 0.625rem 0.75rem; text-align: center; font-size: 1.25rem; color: var(--text);
      }
      .sit-total { margin: 0.75rem 0 0; font-size: 1rem; }
      .sit-total b { font-size: 1.25rem; color: var(--accent); }
      .refl-fields { margin-top: 0.5rem; display: flex; flex-direction: column; gap: 0.75rem; }
      .refl-fields label { font-size: 0.875rem; font-weight: 500; }
      .refl-row { margin-top: 0.25rem; display: flex; align-items: stretch; gap: 0.5rem; }
      .refl-row .text-input { margin-top: 0; min-width: 0; flex: 1; }
      .refl-zoom { flex-shrink: 0; border: 1px solid var(--border); border-radius: 0.5rem; padding: 0 0.875rem; font-size: 0.875rem; font-weight: 600; color: var(--accent); }

      /* ---- popup layer (above the entry panel) ---- */
      .popup-overlay {
        position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.5); padding: 1rem;
      }
      .popup {
        display: flex; width: 100%; max-width: 28rem; max-height: 85vh; flex-direction: column;
        border-radius: 1rem; background: var(--bg); padding: 1rem;
      }
      .popup-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; }
      .popup-head h3 { font-size: 1.25rem; font-weight: 700; margin: 0; }
      .popup-head .popup-sub { margin-top: 0.125rem; font-size: 0.875rem; color: var(--dim); }
      .popup-body { overflow-y: auto; margin-top: 0.5rem; }
      .popup textarea { margin-top: 0; flex: 1; min-height: 12rem; resize: vertical; }
      .popup-actions { margin-top: 1rem; display: flex; gap: 0.5rem; }
      .popup-actions .done { flex: 1; }
      .panel-foot { border-top: 1px solid var(--border); padding: 0.75rem 1rem; }
      .panel-foot .row { display: flex; gap: 0.5rem; }
      .panel-foot .save { flex: 1; }
      .btn-del { border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.75rem 1rem; font-size: 1rem; color: var(--dim); }
      .btn-del-confirm { border: 1px solid var(--accent); border-radius: 0.5rem; padding: 0.75rem 1rem; font-size: 1rem; font-weight: 600; color: var(--accent); }

      /* ---- default items setting ---- */
      .defitem-list { margin-top: 0.75rem; display: grid; grid-template-columns: 1fr; gap: 0.375rem; }

      /* ---- birthday list (settings + popup) ---- */
      .bday-fest { margin-top: 0.25rem; font-size: 0.875rem; color: var(--dim); }
      .bday-list { margin-top: 0.75rem; list-style: none; padding: 0; display: flex; flex-direction: column; gap: 0.375rem; }
      .bday-list li {
        display: flex; align-items: center; gap: 0.5rem;
        border: 1px solid var(--border); background: var(--surface); border-radius: 0.5rem; padding: 0.625rem 0.75rem;
      }
      .bday-list .on { min-width: 0; flex: 1; font-size: 1rem; }
      .bday-list .ot {
        flex-shrink: 0; border-radius: 9999px; padding: 0.125rem 0.625rem;
        background: color-mix(in srgb, var(--accent) 10%, transparent);
        font-size: 0.875rem; font-weight: 700; color: var(--accent);
      }
      .bday-note { margin-top: 0.5rem; font-size: 0.75rem; color: var(--dim); }

      /* ---- faithful paper card (fixed px; never scales) ---- */
      .print-card { background: #fff; color: #000; font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif; padding: 12px; }
      .pc-flex { display: flex; align-items: stretch; gap: 8px; }
      .pc-motto { display: flex; flex-direction: column; align-items: center; justify-content: space-around; padding: 0 2px; font-size: 19px; font-weight: 700; flex-shrink: 0; }
      .pc-left { flex: 1.12 1 0%; min-width: 0; }
      .pc-right { flex: 1 1 0%; min-width: 0; border: 2px solid #171717; }
      .pc-title { text-align: center; font-size: 19px; font-weight: 900; letter-spacing: 0.08em; margin: 0; padding-bottom: 6px; }
      .pc-table { width: 100%; border-collapse: collapse; table-layout: fixed; border: 2px solid #171717; }
      .pc-table td { border: 1px solid #262626; text-align: center; vertical-align: middle; padding: 0; }
      .pc-who { height: 52px; }
      .pc-lab2 { font-size: 15px; line-height: 1.15; }
      .pc-val { font-size: 20px; font-weight: 700; }
      .pc-temple { font-size: 17px; }
      .pc-dh { padding: 4px 0; font-size: 16px; font-weight: 700; line-height: 1.25; }
      .pc-vv { height: 148px; vertical-align: top; }
      .pc-items { font-weight: 700; text-align: center; padding-top: 6px; }
      .pc-items.f0 { font-size: 19px; line-height: 1.9; }
      .pc-items.f1 { font-size: 17px; line-height: 1.55; }
      .pc-items.f2 { font-size: 15px; line-height: 1.4; }
      .pc-items.f3 { font-size: 13px; line-height: 1.3; }
      .pc-note { padding: 4px 2px 0; text-align: center; font-size: 10px; line-height: 1.25; word-break: break-all; }
      .pc-lab { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 8px; font-size: 15px; font-weight: 700; }
      .pc-total { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 24px; font-size: 15px; margin: 6px 0 0; }
      .pc-total .sub { font-size: 11px; color: #525252; }
      .pc-rt { text-align: center; font-size: 17px; font-weight: 700; letter-spacing: 0.35em; margin: 0; padding-top: 8px; }
      .pc-ritems { display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; padding: 6px 12px 10px; font-size: 13px; line-height: 1.9; }
      .pc-ritems p { margin: 0; text-align: left; }
      .pc-rsec { border-top: 2px solid #171717; padding-bottom: 8px; }
      .pc-rnotes { padding: 6px 12px 0; font-size: 12px; line-height: 1.75; }
      .pc-rnotes p { margin: 0 0 2px; text-align: left; }

      /* ---- print: only the faithful paper card prints ---- */
      .print-only { display: none; }
      @media print {
        :root { font-size: 16px !important; }
        .screen-only { display: none !important; }
        .print-only { display: block !important; }
        html, body { height: auto !important; background: #fff !important; }
        .print-card { break-inside: avoid; }
        @page { size: A4 landscape; margin: 8mm; }
      }
    </style>
  </head>

    <script>
      "use strict";

      /* ================================================================
         新奮鬥卡 (HTML5 single-file edition)
         Migrated from the 新奮鬥卡開發 space, keeping its look and feel.
         Differences forced by the single-file form: no server — all data
         is stored on this device (localStorage, one key), and automatic
         backups are three rolling copies (yesterday / last week / last
         month) refreshed when a day's entry panel is opened and the
         copy on hand is older than its interval.
         ================================================================ */

      var ITEMS = [
        { n: 1, name: "祈禱反省懺悔" },
        { n: 2, name: "持誦兩誥救劫" },
        { n: 3, name: "力行人生守則" },
        { n: 4, name: "修持煉心靜坐" },
        { n: 5, name: "參加會禱會坐" },
        { n: 6, name: "持誦基本經典" },
        { n: 7, name: "量力財施奉獻" },
        { n: 8, name: "弘教親和法施" },
        { n: 9, name: "熱心教內服務" },
        { n: 10, name: "參加教內活動" },
        { n: 11, name: "研讀教內經典" },
        { n: 12, name: "其他善行活動" },
      ];

      /** The six basic classics （基本經典）, in the 經典 section's fixed order. */
      var CLASSICS = [
        "廿字真經",
        "奮鬥真經",
        "天人親和真經",
        "北斗徵祥真經",
        "平等真經",
        "大同真經",
      ];

      /** 字體大小 levels (Settings): index stored on the profile. */
      var FONT_LEVELS = [
        { label: "小", pct: 90 },
        { label: "標準", pct: 100 },
        { label: "大", pct: 115 },
        { label: "特大", pct: 130 },
        { label: "超大", pct: 150 },
      ];

      var WEEKDAYS = ["日", "一", "二", "三", "四", "五", "六"];
      /** New-day default checks: items 1 and 4 only (per the user's real card). */
      var NEW_DAY_DEFAULTS = [1, 4];

      function pad(n) { return String(n).padStart(2, "0"); }
      function isoOf(y, m, d) { return y + "-" + pad(m) + "-" + pad(d); }
      function todayLocal() {
        var now = new Date();
        return {
          iso: isoOf(now.getFullYear(), now.getMonth() + 1, now.getDate()),
          y: now.getFullYear(), m: now.getMonth() + 1, d: now.getDate(),
        };
      }
      function parseIso(iso) {
        var p = String(iso).split("-").map(Number);
        return { y: p[0] || 1970, m: p[1] || 1, d: p[2] || 1 };
      }
      function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function fmtNum(n) { return n.toLocaleString("zh-Hant"); }
      function fmtCount(n) { return n === null ? "—" : fmtNum(n); }

      /* ------------------------------------------------------------
         Lunar calendar helpers built on the platform's Chinese
         calendar (Intl.DateTimeFormat "chinese") — no external data.
         干支月 uses the standard 年上起月 rule from the lunar year stem.
         ------------------------------------------------------------ */
      var STEMS = ["甲", "乙", "丙", "丁", "戊", "己", "庚", "辛", "壬", "癸"];
      var BRANCHES = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];
      var monthDayFmt = new Intl.DateTimeFormat("zh-Hant-u-ca-chinese", { month: "long", day: "numeric" });
      var DIGITS = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九"];
      var MONTH_NAMES = ["正月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "冬月", "臘月"];

      // Some WebView/ICU builds return raw month codes like "M10" (or
      // "閏M6") instead of 十月. Map those back to the proper name.
      function normalizeMonthName(raw) {
        var isLeap = raw.indexOf("閏") === 0;
        var base = isLeap ? raw.slice(1) : raw;
        var match = /^M(\d{1,2})$/i.exec(base) || /^(\d{1,2})月?$/.exec(base);
        if (match) {
          var name = MONTH_NAMES[Number(match[1]) - 1];
          if (name) return (isLeap ? "閏" : "") + name;
        }
        return raw;
      }

      var lnyCache = {};
      function lunarNewYearIso(gregYear) {
        if (lnyCache[gregYear]) return lnyCache[gregYear];
        var found = gregYear + "-02-20";
        for (var off = 0; off <= 40; off++) {
          var dt = new Date(Date.UTC(gregYear, 0, 20 + off, 12));
          var mn = "", dd = 0;
          var parts = monthDayFmt.formatToParts(dt);
          for (var i = 0; i < parts.length; i++) {
            if (parts[i].type === "month") mn = normalizeMonthName(parts[i].value);
            if (parts[i].type === "day") dd = Number(parts[i].value);
          }
          if (mn === "正月" && dd === 1) {
            found = gregYear + "-" + pad(dt.getUTCMonth() + 1) + "-" + pad(dt.getUTCDate());
            break;
          }
        }
        lnyCache[gregYear] = found;
        return found;
      }

          temple: typeof p.temple === "string" ? p.temple : "",
          name: typeof p.name === "string" ? p.name : "",
          daoName: typeof p.daoName === "string" ? p.daoName : "",

      /** Items pre-checked when a brand-new day is opened. */
      function newDayDefaults() {
        return Array.isArray(state.profile.defaultItems)
          ? state.profile.defaultItems : NEW_DAY_DEFAULTS;
      }
      function normFullState(raw) {
        var st = defaultState();
        if (!raw || typeof raw !== "object") return st;
        st.profile = normProfile(raw.profile);
        if (Array.isArray(raw.entries)) {
          raw.entries.forEach(function (e) {
            var ne = normEntry(e);
            if (ne) st.entries.push(ne);
          });
          st.entries.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
        }
        if (Array.isArray(raw.reflectionItems)) {
          raw.reflectionItems.forEach(function (it) {
            if (it && typeof it === "object" && typeof it.id === "number" && typeof it.label === "string") {
              st.reflectionItems.push({ id: it.id, label: it.label });
            }
          });

      }

      var state = defaultState();
      var storageOk = true;

      function persist() {
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(state));
        } catch (err) {
          storageOk = false;
        }
      }
      function loadStore() {
        try {
          var raw = localStorage.getItem(STORE_KEY);
          if (raw) {
            var parsed = JSON.parse(raw);
            var st = normFullState(parsed);
            if (parsed && typeof parsed === "object") {
              if (parsed.snapshots && typeof parsed.snapshots === "object") st.snapshots = parsed.snapshots;
              // The old monthly archive slot is superseded by the
              // rolling auto-backups; drop it so it stops showing.
              delete st.snapshots["last-month"];
              st.autoBackups = normAutoBackups(parsed.autoBackups);
            }
            state = st;
          }
        } catch (err) {
          state = defaultState();
        }

      /* ---- GFS snapshots (same slots/semantics as the source) ---- */
      function snapshotPayload(extra) {
        var payload = {
          profile: JSON.parse(JSON.stringify(state.profile)),
          entries: JSON.parse(JSON.stringify(state.entries)),
          reflectionItems: JSON.parse(JSON.stringify(state.reflectionItems)),
        };
        if (extra) Object.keys(extra).forEach(function (k) { payload[k] = extra[k]; });
        return payload;
      }
      function writeSnapshot(slot, extra) {
        state.snapshots[slot] = {
          payload: JSON.stringify(snapshotPayload(extra)),
          takenAt: Date.now(),
          entryCount: state.entries.length,
        };
      }
      // Run before every mutating save: latest-undo always captures the
      // pre-save state; on the first save touching a new day,
      // today-initial and yesterday capture the state as the day began.
      function snapshotBeforeSave(todayIso) {
        writeSnapshot("latest-undo");
        var hasToday = state.entries.some(function (e) { return e.date === todayIso; });
        if (!hasToday) {
          writeSnapshot("today-initial");
          writeSnapshot("yesterday");
        }
      }
      /* ---- Rolling auto-backups （自動備份） ----
         Three slots, one copy each; refreshing overwrites the old
         copy. Each copy is a full copy of all data in the manual
         export's JSON format, stamped with the date it was taken
         (backupDate) and the earliest entry date it covers. */
      var AUTO_BACKUP_SLOTS = [
        { key: "yesterday", label: "昨日備份", maxAgeMs: 24 * 60 * 60 * 1000 },
        { key: "lastWeek", label: "上週備份", maxAgeMs: 7 * 24 * 60 * 60 * 1000 },
        { key: "lastMonth", label: "上月備份", maxAgeMs: 30 * 24 * 60 * 60 * 1000 },
      ];
      function autoBackupSlot(key) {
        for (var i = 0; i < AUTO_BACKUP_SLOTS.length; i++) {
          if (AUTO_BACKUP_SLOTS[i].key === key) return AUTO_BACKUP_SLOTS[i];
        }
        return null;
      }
      function normAutoBackups(raw) {
        var out = {};
        if (raw && typeof raw === "object") {
          AUTO_BACKUP_SLOTS.forEach(function (s) {
            var b = raw[s.key];
            if (b && typeof b === "object" && typeof b.payload === "string" &&
                typeof b.takenAt === "number" && isFinite(b.takenAt) &&
                typeof b.backupDate === "string") {
              out[s.key] = {
                payload: b.payload,
                takenAt: b.takenAt,
                backupDate: b.backupDate,
                earliest: typeof b.earliest === "string" ? b.earliest : null,
              };
            }
          });
        }
        return out;
      }
      function writeAutoBackup(key) {
        state.autoBackups[key] = {
          payload: JSON.stringify(snapshotPayload(), null, 2),
          takenAt: Date.now(),
          backupDate: todayLocal().iso,
          earliest: state.entries.length ? state.entries[0].date : null,
        };
      }
      // Checked whenever a day's entry panel opens (a calendar date
      // cell or a 逐日 row is tapped): a copy older than its interval
      // — 24 hours / 7 days / 30 days — or not yet taken is replaced
      // with a fresh copy of the current data and its backup date
      // moves to the copy date; a copy still fresh is left alone.
      function checkAutoBackups() {
        var now = Date.now();
        var changed = false;
        AUTO_BACKUP_SLOTS.forEach(function (s) {
          var b = state.autoBackups[s.key];
          if (!b || now - b.takenAt > s.maxAgeMs) {
            writeAutoBackup(s.key);
            changed = true;
          }
        });
        if (changed) persist();
      }
      function autoBackupFilename(slot, b) {
        var bd = b.backupDate.replace(/-/g, "");
        return b.earliest
          ? "奮鬥卡-" + slot.label + "-" + b.earliest.replace(/-/g, "") + "-" + bd + ".json"
          : "奮鬥卡-" + slot.label + "-" + bd + ".json";
      }

      function entryTotal(e, baoUnit) {
        if (e.huangCount === null && e.baoCount === null) return null;
        var a = e.huangCount || 0, b = e.baoCount || 0;
        return baoUnit === "ben" ? a + b * 1000 : a + b;
      }
      function monthEntries(y, m) {
        var prefix = y + "-" + pad(m) + "-";
        return state.entries.filter(function (e) { return e.date.indexOf(prefix) === 0; });
      }
      function entryByDate(iso) {
        for (var i = 0; i < state.entries.length; i++) {

        }
        return undefined;
      }
      function currentStreak(todayIso) {
        var filled = {};
        state.entries.forEach(function (e) { filled[e.date] = true; });
        var p = parseIso(todayIso);
        var cursor = new Date(p.y, p.m - 1, p.d);
        if (!filled[todayIso]) cursor.setDate(cursor.getDate() - 1);
        var streak = 0;
        for (;;) {
          var iso = isoOf(cursor.getFullYear(), cursor.getMonth() + 1, cursor.getDate());
          if (!filled[iso]) break;
          streak += 1;
          cursor.setDate(cursor.getDate() - 1);
        }
        return streak;
      }

      function downloadBlob(blob, filename) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = filename;

      }
      /* ------------------------------------------------------------
         One-tap PDF share — the paper card is rasterized with the
         embedded html2canvas, and the JPEG is wrapped into a real
         single-page A4-landscape PDF by a small hand-written writer
         (no external dependency, so the file stays self-contained
         and offline). The PDF is then shared through the native
         system share sheet, exactly like the HTML file above.
         ------------------------------------------------------------ */
      function buildPdfBlob(jpeg, imgW, imgH) {
        var pageW = 841.89, pageH = 595.28; // A4 landscape, pt
        var margin = 22.68; // 8mm, same margin as the print layout
        var availW = pageW - margin * 2;
        var availH = pageH - margin * 2;
        var s = Math.min(availW / imgW, availH / imgH);
        var w = (imgW * s).toFixed(2), h = (imgH * s).toFixed(2);
        var x = ((pageW - imgW * s) / 2).toFixed(2);
        var y = (pageH - margin - imgH * s).toFixed(2);
        var content = "q " + w + " 0 0 " + h + " " + x + " " + y + " cm /Im0 Do Q\n";
        var chunks = [];
        var offsets = [];
        var size = 0;
        // Every string pushed here is pure ASCII, so its length is
        // also its byte length; the JPEG goes in as raw bytes.
        function push(c) { chunks.push(c); size += c.length; }
        function obj(n, body) {
          offsets[n] = size;
          push(n + " 0 obj\n" + body + "\nendobj\n");
        }
        push("%PDF-1.4\n");
        push(new Uint8Array([0x25, 0xe2, 0xe3, 0xcf, 0xd3, 0x0a]));
        obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
        obj(2, "<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
        obj(3, "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + pageW + " " + pageH + "] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>");
        offsets[4] = size;
        push("4 0 obj\n<< /Type /XObject /Subtype /Image /Width " + imgW + " /Height " + imgH + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + jpeg.length + " >>\nstream\n");
        push(jpeg);
        push("\nendstream\nendobj\n");
        obj(5, "<< /Length " + content.length + " >>\nstream\n" + content + "endstream");
        var xrefPos = size;
        var xref = "xref\n0 6\n0000000000 65535 f \n";
        for (var i = 1; i <= 5; i++) {
          var off = String(offsets[i]);
          while (off.length < 10) off = "0" + off;
          xref += off + " 00000 n \n";
        }
        push(xref);
        push("trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n" + xrefPos + "\n%%EOF");
        return new Blob(chunks, { type: "application/pdf" });
      }

      function generateCardPdfBlob(y, m) {
        return new Promise(function (resolve, reject) {
          if (typeof html2canvas !== "function") { reject(new Error("html2canvas unavailable")); return; }
          // Render a fresh copy of the card off-screen at a fixed
          // width, so the capture never depends on the phone's
          // viewport, the preview's horizontal scroll position, or
          // the 字體大小 setting (the card is fixed-px by design).
          var holder = document.createElement("div");
          holder.style.cssText = "position:absolute;left:-10000px;top:0;width:1084px;background:#fff;";
          holder.innerHTML = printCardHtml(y, m);
          document.body.appendChild(holder);
          var done = false;
          function cleanup() {
            if (holder.parentNode) holder.parentNode.removeChild(holder);
          }
          html2canvas(holder.querySelector(".print-card"), {
            scale: 2, backgroundColor: "#ffffff", logging: false,
          }).then(function (canvas) {
            canvas.toBlob(function (blob) {
              cleanup();
              if (done) return;
              done = true;
              if (!blob) { reject(new Error("JPEG encode failed")); return; }
              blob.arrayBuffer().then(function (buf) {
                resolve(buildPdfBlob(new Uint8Array(buf), canvas.width, canvas.height));
              }, reject);
            }, "image/jpeg", 0.92);
          }, function (err) {
            cleanup();
            if (!done) { done = true; reject(err); }
          });
        });
      }

      function sharePdfDocument(y, m) {
        if (ui.pdfBusy) return;
        ui.pdfBusy = true;
        ui.pdfError = false;
        render();
        // Let the 「產生 PDF 中…」 state paint before rasterizing.
        setTimeout(function () {
          generateCardPdfBlob(y, m).then(function (blob) {
            ui.pdfBusy = false;
            var filename = "奮鬥卡-" + y + "年" + pad(m) + "月.pdf";
            function fallbackDownload() {
              downloadBlob(blob, filename);
              ui.pdfNote = filename;
            }
            var file = null;
            try { file = new File([blob], filename, { type: "application/pdf" }); } catch (err) { file = null; }
            var data = file ? { files: [file], title: filename } : null;
            var canFiles = false;
            if (data) {
              try { canFiles = typeof navigator.canShare === "function" && !!navigator.canShare(data); } catch (err) { canFiles = false; }
            }
            if (data && (canFiles || typeof navigator.share === "function")) {
              try {
                navigator.share(data).then(function () {
                  ui.pdfNote = "";
                  render();
                }, function (err) {
                  // Closing the sheet is not a failure; anything else
                  // falls back to downloading the PDF, with a hint.
                  if (!err || err.name !== "AbortError") fallbackDownload();
                  render();
                });
              } catch (err) { fallbackDownload(); render(); }
            } else {
              // No share sheet available (e.g. an app's WebView):
              // download the PDF and point the user at Downloads,
              // where the same system share sheet can be opened.
              fallbackDownload();
              render();
            }
          }, function () {
            ui.pdfBusy = false;
            ui.pdfError = true;
            render();
          });
        }, 80);
      }

      function stepperHtmlUnit(id, label, value) {

        if (!panel) return "";
        var p = parseIso(panel.date);
        var lunar = lunarInfo(p.y, p.m, p.d);
        var weekday = WEEKDAYS[new Date(p.y, p.m - 1, p.d).getDay()];
        var match = birthdayMatchFor(p.y, p.m, p.d);
        var ex = panel.existing;
        var baoUnit = state.profile.baoUnit;

        var h = '<div class="overlay" data-act="overlay-bg" role="dialog" aria-modal="true" aria-label="' + p.m + "月" + p.d + '日記錄登錄">';
        h += '<div class="panel" data-stop="1">';
        h += '<div class="panel-head"><div><h2 class="font-display">' + p.m + "月" + p.d + "日 星期" + weekday + "</h2>" +
          '<p class="lunar-line">農曆' + esc(lunar.fullLabel) +
          (lunar.yearGanzhi ? " · " + lunar.yearGanzhi + "年" + (lunar.monthGanzhi ? " " + lunar.monthGanzhi + "月" : "") : "") +
          "</p></div>" +
          '<button type="button" class="close-x" data-act="panel-close" aria-label="關閉">✕</button></div>';

        if (match) {
          h += '<div class="panel-bday">' +
            '<button type="button" class="bday-btn" data-act="bday-open" aria-label="查看本日仙佛聖誕">仙佛聖誕（' + match.occasions.length + "）</button></div>";
        }

        h += '<div class="panel-body">';

        /* 奮鬥項目 */
        h += '<fieldset class="first"><legend>奮鬥項目</legend><p class="sub">點選今日落實的項次</p><div class="item-list">';
        ITEMS.forEach(function (item) {
          var checked = panel.items.has(item.n);
          h += '<label class="item-row' + (checked ? " checked" : "") + '">' +
            '<input type="checkbox" data-item="' + item.n + '" aria-label="第' + item.n + "項 " + esc(item.name) + '"' + (checked ? " checked" : "") + " />" +
            '<span class="num font-display">' + item.n + '</span><span class="nm">' + esc(item.name) + "</span></label>";
        });
        h += "</div></fieldset>";

        /* 簡要事蹟／備註 */
        h += '<div class="note-field"><label for="day-note">簡要事蹟／備註（12 項以外的善行或心得）</label>' +
          '<textarea id="day-note" aria-label="簡要事蹟備註" rows="3">' + esc(ex ? ex.note : "") + "</textarea></div>";

        /* 皇寶誥 */
        h += '<fieldset><legend>皇寶誥</legend><div class="stepper">' +
          stepperHtml("count-huang", "皇誥數（聲）", ex && ex.huangCount !== null ? String(ex.huangCount) : "") +
          stepperHtmlUnit("count-bao", baoUnit === "ben" ? "寶誥數（本）" : "寶誥數（聲）", ex && ex.baoCount !== null ? String(ex.baoCount) : "") +
          "</div></fieldset>";

        /* 經典 */
        h += '<fieldset><legend>經典（本）</legend><div class="classic-list">';
        CLASSICS.forEach(function (name, i) {
          var v = panel.classics[i] || 0;
          h += '<div class="classic-row"><span class="cname">' + esc(name) + "</span>" +
            '<button type="button" class="cbtn" data-act="classic-dec" data-i="' + i + '" aria-label="' + esc(name) + '減少一本"' + (v === 0 ? " disabled" : "") + ">−</button>" +
            '<span class="cval" id="classic-val-' + i + '" aria-label="' + esc(name) + '本數">' + v + "</span>" +
            '<button type="button" class="cbtn plus" data-act="classic-inc" data-i="' + i + '" aria-label="' + esc(name) + '增加一本">＋</button>' +
            '<button type="button" class="cclear" data-act="classic-clear" data-i="' + i + '" aria-label="' + esc(name) + '清空"' + (v === 0 ? " disabled" : "") + ">清空</button></div>";
        });
        h += '</div><p class="sub">填入本數會自動勾選第 6 項「持誦基本經典」（可再手動取消）。</p></fieldset>';

        /* 靜坐 */
        var sitVals = ex ? ex.sitting : [null, null, null, null];
        var sitTotal = sitVals.reduce(function (s, v) { return s + (v || 0); }, 0);
        h += '<fieldset><legend>靜坐（分鐘）</legend><div class="sit-list">';
        sitVals.forEach(function (v, i) {
          h += '<div class="sit-row2"><label for="sitting-' + i + '">第 ' + (i + 1) + " 次</label>" +
            '<input id="sitting-' + i + '" data-sit="' + i + '" aria-label="第' + (i + 1) + '次靜坐分鐘" inputmode="numeric" value="' + (v === null ? "" : v) + '" placeholder="0" /></div>';
        });
        h += '</div><p class="sit-total">合計 <b class="font-display" id="sit-total">' + sitTotal + "</b> 分鐘</p>" +
          '<p class="sub">填入分鐘會自動勾選第 4 項「修持煉心靜坐」（可再手動取消）。</p></fieldset>';

        /* 察覺反省筆記 */
        h += '<fieldset><legend>察覺反省筆記</legend>';
        if (state.reflectionItems.length > 0) {
          h += '<div class="refl-fields">';
          state.reflectionItems.forEach(function (it) {
            var ans = ex && ex.reflectionAnswers[String(it.id)] ? ex.reflectionAnswers[String(it.id)] : "";
            h += '<div><label for="reflect-' + it.id + '">' + esc(it.label) + "</label>" +
              '<div class="refl-row"><input class="text-input" id="reflect-' + it.id + '" data-refl="' + it.id + '" aria-label="' + esc(it.label) + '" maxlength="500" value="' + esc(ans) + '" />' +
              '<button type="button" class="refl-zoom" data-act="enlarge-open" data-id="' + it.id + '" aria-label="放大輸入：' + esc(it.label) + '">放大</button></div></div>';
          });
          h += "</div>";
        }
        h += '<div class="note-field"><label for="reflection-note">今日反省筆記</label>' +
          '<textarea id="reflection-note" aria-label="今日反省筆記" rows="3">' + esc(ex ? ex.reflectionNote : "") + "</textarea></div>";
        if (state.reflectionItems.length === 0) {
          h += '<p class="sub">固定反省項目可在「設定」頁新增，會出現在每天的這一節。</p>';
        }
        h += "</fieldset>";

        h += "</div>"; // panel-body

        h += '<div class="panel-foot">';
        if (panel.error) h += '<p class="err" role="alert" style="margin:0 0 0.5rem">' + esc(panel.error) + "</p>";
        h += '<div class="row"><button type="button" class="btn-accent save" data-act="panel-save">儲存</button>';
        if (ex) {
          if (panel.confirmDelete) {
            h += '<button type="button" class="btn-del-confirm" data-act="panel-del-confirm">確認刪除？</button>';
          } else {
            h += '<button type="button" class="btn-del" data-act="panel-del-ask">刪除本日</button>';
          }
        }
        h += "</div></div>";
        h += "</div>"; // panel

        h += "</div>";
        return h;
      }

      function renderOverlay() {
        document.getElementById("overlay-root").innerHTML = panelHtml();
        wirePanel();
      }

      /* Popups render into their own root, separate from the panel,
         so opening/closing one never rebuilds the panel: unsaved
         input and the panel's scroll position survive untouched. */
      function renderPopup() {
        var root = document.getElementById("popup-root");
        if (!panel || !panel.popup) { root.innerHTML = ""; return; }
        var pop = panel.popup;
        var h = "";
        if (pop.type === "bday") {
          var p = parseIso(panel.date);
          var lunar = lunarInfo(p.y, p.m, p.d);
          var match = birthdayMatchFor(p.y, p.m, p.d);
          if (!match) { root.innerHTML = ""; return; }
          h = '<div class="popup-overlay"><div class="popup" role="dialog" aria-modal="true" aria-label="仙佛聖誕">';
          h += '<div class="popup-head"><div><h3 class="font-display">仙佛聖誕</h3>' +
            '<p class="popup-sub">農曆' + esc(lunar.fullLabel) + "</p></div>" +
            '<button type="button" class="close-x" data-act="popup-close" aria-label="關閉">✕</button></div>';
          h += '<div class="popup-body">';
          if (match.festival) h += '<p class="bday-fest">本日亦逢' + esc(match.festival) + "</p>";
          h += '<ul class="bday-list">';
          match.occasions.forEach(function (oc) {
            h += '<li><span class="on">' + esc(oc.name) + '</span><span class="ot">' + esc(oc.type) + "</span></li>";
          });
          h += "</ul>";
          if (match.observedEarly) {
            h += '<p class="bday-note">本月無三十日，三十日之聖誕提前於本日（廿九日）。</p>';
          }
          h += "</div>";
          h += '<div class="popup-actions"><button type="button" class="btn-accent done" data-act="popup-close">關閉</button></div>';
          h += "</div></div>";
        } else if (pop.type === "enlarge") {
          h = '<div class="popup-overlay"><div class="popup" role="dialog" aria-modal="true" aria-label="放大輸入：' + esc(pop.label) + '">';
          h += '<div class="popup-head"><div><h3 class="font-display">' + esc(pop.label) + "</h3></div>" +
            '<button type="button" class="close-x" data-act="popup-close" aria-label="取消">✕</button></div>';
          h += '<textarea id="enlarge-text" aria-label="' + esc(pop.label) + '" maxlength="500" style="margin-top:0.75rem">' + esc(pop.text) + "</textarea>";
          h += '<div class="popup-actions"><button type="button" class="btn-ghost-lg" data-act="popup-close">取消</button>' +
            '<button type="button" class="btn-accent done" data-act="enlarge-done">完成</button></div>';
          h += "</div></div>";
        }
        root.innerHTML = h;
      }
      function closePopup() {
        if (panel) panel.popup = null;
        renderPopup();
      }

      function parseCountInput(s) {
        var t = String(s == null ? "" : s).trim();
        if (t === "") return null;
        var n = Number(t);
        if (!isFinite(n) || n < 0) return -1;
        return Math.floor(n);
      }
      function el(id) { return document.getElementById(id); }

      function autoCheckItem(n) {
        if (!panel) return;
        panel.items.add(n);
        var cb = document.querySelector('input[data-item="' + n + '"]');
        if (cb) {
          cb.checked = true;
          var row = cb.closest(".item-row");
          if (row) row.classList.add("checked");
        }
      }

      function wirePanel() {
        if (!panel) return;
        var root = document.getElementById("overlay-root");
        root.querySelectorAll("input[data-item]").forEach(function (cb) {
          cb.addEventListener("change", function () {
            var n = Number(cb.getAttribute("data-item"));
            if (cb.checked) panel.items.add(n); else panel.items.delete(n);
            var row = cb.closest(".item-row");
            if (row) row.classList.toggle("checked", cb.checked);
          });
        });
        root.querySelectorAll("input[data-sit]").forEach(function (inp) {
          inp.addEventListener("input", function () {
            var total = 0;
            root.querySelectorAll("input[data-sit]").forEach(function (x) {
              var n = Number(String(x.value).trim());
              if (String(x.value).trim() !== "" && isFinite(n) && n > 0) total += Math.floor(n);
            });
            var t = el("sit-total");
            if (t) t.textContent = String(total);
            var n2 = Number(String(inp.value).trim());
            if (String(inp.value).trim() !== "" && isFinite(n2) && n2 > 0) autoCheckItem(4);
          });
        });
      }

      function savePanel() {
        if (!panel) return;
        var h = parseCountInput(el("count-huang").value);
        var b = parseCountInput(el("count-bao").value);
        if (h === -1 || b === -1) { panel.error = "誥數請輸入 0 以上的整數"; renderOverlay(); return; }
        var sit = [];
        var sitBad = false;
        for (var i = 0; i < 4; i++) {
          var v = parseCountInput(el("sitting-" + i).value);
          if (v === -1) sitBad = true;
          sit.push(v);
        }
        if (sitBad) { panel.error = "靜坐分鐘請輸入 0 以上的整數"; renderOverlay(); return; }
        var answers = {};
        state.reflectionItems.forEach(function (it) {
          var inp = el("reflect-" + it.id);
          if (inp && inp.value.trim() !== "") answers[String(it.id)] = inp.value;
        });
        var reflectionNote = el("reflection-note").value;
        var note = el("day-note").value;
        var items = Array.from(panel.items).sort(function (a, c) { return a - c; });
        var classics = panel.classics.slice();

        snapshotBeforeSave(todayLocal().iso);
        var isEmpty =
          items.length === 0 && h === null && b === null &&
          classics.every(function (n) { return n === 0; }) &&
          sit.every(function (n) { return n === null; }) &&
          Object.keys(answers).length === 0 &&
          reflectionNote.trim() === "" && note.trim() === "";
        var idx = state.entries.findIndex(function (e) { return e.date === panel.date; });
        if (isEmpty) {
          if (idx >= 0) state.entries.splice(idx, 1);
        } else {
          var entry = {
            date: panel.date, items: items, huangCount: h, baoCount: b,
            classics: classics, sitting: sit, reflectionAnswers: answers,
            reflectionNote: reflectionNote, note: note,
          };
          if (idx >= 0) state.entries[idx] = entry;
          else {
            state.entries.push(entry);
            state.entries.sort(function (a, c) { return a.date < c.date ? -1 : a.date > c.date ? 1 : 0; });
          }
        }
        persist();
        closePanel();
        render();
      }

      function deletePanelEntry() {
        if (!panel) return;
        snapshotBeforeSave(todayLocal().iso);
        var idx = state.entries.findIndex(function (e) { return e.date === panel.date; });
        if (idx >= 0) state.entries.splice(idx, 1);
        persist();
        closePanel();
        render();
      }

      /* ------------------------------------------------------------
         App shell render
         ------------------------------------------------------------ */
      function applyFontScale() {
        var level = Math.min(FONT_LEVELS.length - 1, Math.max(0, state.profile.fontSize));
        document.documentElement.style.setProperty("--font-scale", String(FONT_LEVELS[level].pct / 100));
      }

      function render() {
        applyFontScale();
        var t = todayLocal();
        var app = document.getElementById("app");
        var printRoot = document.getElementById("print-root");

        if (ui.printPreview) {
          app.innerHTML = '<div style="min-height:100vh">' + printPreviewHtml() + "</div>";
          printRoot.innerHTML = "";
          window.scrollTo(0, 0);
          return;
        }

        var todayEntry = entryByDate(t.iso);
        var tl = lunarInfo(t.y, t.m, t.d);
        var baoUnit = state.profile.baoUnit;
        var streak = currentStreak(t.iso);
        var showBanner = t.d >= 1 && t.d <= 5;

        var h = '<div class="wrap screen-only">';
        if (showBanner) {
          h += '<div class="banner" role="note">本月 1 至 5 日是呈報期：請核對上個月奮鬥卡，列印呈品牌所屬教院，並匯出一份備份留底。' +
            '<button type="button" data-act="goto-report">查看上月報表</button></div>';
        }
        if (!storageOk) {
          h += '<div class="banner" role="alert">此裝置無法儲存資料（瀏覽器儲存空間不可用），本次開啟所填的內容在關閉後不會保留。請改用一般瀏覽模式開啟，或匯出備份留底。</div>';
        }

        /* Today hero */
        h += '<header class="hero">';
        h += '<p class="hero-date">' + t.y + "年" + t.m + "月" + t.d + "日 星期" + WEEKDAYS[new Date(t.y, t.m - 1, t.d).getDay()] +
          " · 農曆" + esc(tl.fullLabel) +
          (tl.yearGanzhi ? " · " + tl.yearGanzhi + "年" + (tl.monthGanzhi ? " " + tl.monthGanzhi + "月" : "") : "") + "</p>";
        h += '<div class="hero-row"><h1 class="font-display">電子奮鬥卡</h1>';
        if (streak > 0) h += '<p class="streak">連續填卡 <b class="font-display">' + streak + "</b> 天</p>";
        h += "</div>";
        if (todayEntry) {
          var names = todayEntry.items.length > 0
            ? todayEntry.items.map(function (n) {
                var it = ITEMS.filter(function (x) { return x.n === n; })[0];
                return it ? it.name : String(n);
              }).join("、")
            : "（無勾選項目）";
          var tot = entryTotal(todayEntry, baoUnit);
          h += '<p class="hero-summary">今日已填：' + esc(names) + (tot !== null ? " · 誥數合計 " + fmtNum(tot) : "") + "</p>";
        }
        h += "</header>";

        /* Tabs */
        h += '<nav class="tabs" aria-label="主要檢視">';
        [["calendar", "登錄"], ["report", "月報表"], ["settings", "設定"]].forEach(function (tab) {
          h += '<button type="button" data-act="tab" data-view="' + tab[0] + '"' +
            (ui.view === tab[0] ? ' aria-current="page"' : "") + ">" + tab[1] + "</button>";
        });
        h += "</nav>";

        h += "<main>";
        if (ui.view === "calendar") h += calendarViewHtml(t, t.iso);
        else if (ui.view === "report") h += reportViewHtml();
        else if (ui.view === "settings") h += settingsHtml();
        h += "</main></div>";

        app.innerHTML = h;
        printRoot.innerHTML = printCardHtml(ui.reportY, ui.reportM);
        wireMain();
      }

      function wireMain() {
        var yr = el("report-year"), rm = el("report-month");
        if (yr) yr.addEventListener("change", function () { ui.reportY = Number(yr.value); render(); });
        if (rm) rm.addEventListener("change", function () { ui.reportM = Number(rm.value); render(); });
        var imp = el("import-file");
        if (imp) imp.addEventListener("change", function () {
          var f = imp.files && imp.files[0];
          if (f) doImportFile(f);
          imp.value = "";
        });
        ["temple", "name", "daoName"].forEach(function (k) {
          var inp = el("pf-" + k);
          if (inp) inp.addEventListener("input", function () { ui.profileSaved = false; });
        });
        document.querySelectorAll("input[data-defitem]").forEach(function (cb) {
          cb.addEventListener("change", function () {
            var n = Number(cb.getAttribute("data-defitem"));
            var cur = newDayDefaults().slice();
            if (cb.checked) { if (cur.indexOf(n) < 0) cur.push(n); }
            else cur = cur.filter(function (x) { return x !== n; });
            cur.sort(function (a, b) { return a - b; });
            state.profile.defaultItems = cur;
            persist();
            var row = cb.closest(".item-row");
            if (row) row.classList.toggle("checked", cb.checked);
          });
        });
      }

      function doExport() {
        var blob = new Blob([JSON.stringify({
          profile: state.profile,
          entries: state.entries,
          reflectionItems: state.reflectionItems,
        }, null, 2)], { type: "application/json" });
        downloadBlob(blob, "fendouka-backup-" + todayLocal().iso + ".json");
      }

      function doImportFile(file) {
        file.text().then(function (text) {
          try {
            var parsed = JSON.parse(text);
            if (!parsed || typeof parsed !== "object" || !("profile" in parsed) || !("entries" in parsed) || !Array.isArray(parsed.entries)) {
              throw new Error("bad");
            }
            writeSnapshot("latest-undo");
            var st = normFullState(parsed);
            state.profile = st.profile;
            state.entries = st.entries;
            state.reflectionItems = st.reflectionItems;
            persist();
            ui.settingsError = null;
            ui.confirmSlot = null;
            render();
          } catch (err) {
            ui.settingsError = "匯入失敗：不是有效的奮鬥卡備份檔";
            render();
          }
        }, function () {
          ui.settingsError = "匯入失敗：不是有效的奮鬥卡備份檔";
          render();
        });
      }

      /* ------------------------------------------------------------
         Global click delegation
         ------------------------------------------------------------ */
      document.addEventListener("click", function (ev) {
        var t = ev.target;
        if (!(t instanceof Element)) return;

        /* Panel / popup layer */
        if (panel) {
          /* Popup layer sits above the panel and is handled first:
             tapping its backdrop, ✕, 關閉 or 取消 closes only the
             popup; 完成 writes the enlarged text back to its field. */
          if (panel.popup) {
            if (t.classList.contains("popup-overlay")) { closePopup(); return; }
            var popEl = t.closest("[data-act]");
            if (popEl && popEl.closest("#popup-root")) {
              var popAct = popEl.getAttribute("data-act");
              if (popAct === "popup-close") { closePopup(); return; }
              if (popAct === "enlarge-done") {
                var ta = el("enlarge-text");
                var target = el("reflect-" + panel.popup.id);
                if (ta && target) target.value = ta.value;
                closePopup();
                return;
              }
              return;
            }
            if (t.closest("#popup-root")) return;
          }
          var stop = t.closest("[data-stop]");
          var actEl = t.closest("[data-act]");
          var act = actEl ? actEl.getAttribute("data-act") : null;
          if (t.classList.contains("overlay")) { closePanel(); render(); return; }
          if (!stop && !actEl) return;
          if (actEl && actEl.closest("#overlay-root")) {
            switch (act) {
              case "panel-close": closePanel(); render(); return;
              case "panel-save": savePanel(); return;
              case "panel-del-ask": panel.confirmDelete = true; renderOverlay(); return;
              case "panel-del-confirm": deletePanelEntry(); return;
              case "bday-open":
                panel.popup = { type: "bday" };
                renderPopup();
                return;
              case "enlarge-open": {
                var rid = Number(actEl.getAttribute("data-id"));
                var rItem = null;
                state.reflectionItems.forEach(function (it) { if (it.id === rid) rItem = it; });
                var rInp = el("reflect-" + rid);
                if (rItem && rInp) {
                  panel.popup = { type: "enlarge", id: rid, label: rItem.label, text: rInp.value };
                  renderPopup();
                }
                return;
              }
              case "step-add": {
                var inp = el(actEl.getAttribute("data-target"));
                var cur = parseCountInput(inp.value);
                inp.value = String((cur === null || cur === -1 ? 0 : cur) + Number(actEl.getAttribute("data-step")));
                return;
              }
              case "step-sub": {
                var inpS = el(actEl.getAttribute("data-target"));
                var curS = parseCountInput(inpS.value);
                /* Minimum 0, like the 經典 rows; an unfilled （未填）
                   field stays unfilled instead of becoming 0. */
                if (curS !== null && curS !== -1) inpS.value = String(Math.max(0, curS - Number(actEl.getAttribute("data-step"))));
                return;
              }
              case "step-clear":
                el(actEl.getAttribute("data-target")).value = "";
                return;
              case "classic-inc": case "classic-dec": case "classic-clear": {
                var i = Number(actEl.getAttribute("data-i"));
                if (act === "classic-inc") { panel.classics[i] = (panel.classics[i] || 0) + 1; autoCheckItem(6); }
                if (act === "classic-dec") panel.classics[i] = Math.max(0, (panel.classics[i] || 0) - 1);
                if (act === "classic-clear") panel.classics[i] = 0;
                /* Update just this row in place — re-rendering the
                   whole panel here reset its scroll position to the
                   top (and dropped unsaved input in other fields).
                   The 皇寶誥 steppers above already work this way:
                   they only touch their own input, never re-render. */
                var cval = el("classic-val-" + i);
                if (cval) cval.textContent = String(panel.classics[i] || 0);
                var crow = actEl.closest(".classic-row");
                if (crow) {
                  var isZero = (panel.classics[i] || 0) === 0;
                  var dBtn = crow.querySelector('[data-act="classic-dec"]');
                  var cBtn = crow.querySelector('[data-act="classic-clear"]');
                  if (dBtn) dBtn.disabled = isZero;
                  if (cBtn) cBtn.disabled = isZero;
                }
                return;
              }
            }
            return;
          }
          return;
        }

        var elx = t.closest("[data-act]");
        if (!elx) return;
        var a = elx.getAttribute("data-act");
        var t2 = todayLocal();
        switch (a) {
          case "tab":
            ui.view = elx.getAttribute("data-view");
            ui.profileSaved = false;
            ui.settingsError = null;
            ui.confirmSlot = null;
            ui.confirmReflRemove = null;
            render();
            break;
          case "goto-report":
            ui.view = "report";
            render();
            break;
          case "calmode":
            ui.calMode = elx.getAttribute("data-mode");
            render();
            break;
          case "shift": {
            var dt = new Date(ui.viewY, ui.viewM - 1 + Number(elx.getAttribute("data-delta")), 1);
            ui.viewY = dt.getFullYear();
            ui.viewM = dt.getMonth() + 1;
            render();
            break;
          }
          case "thismonth":
            ui.viewY = t2.y; ui.viewM = t2.m;
            render();
            break;
          case "pick":
            openPanel(elx.getAttribute("data-date"));
            break;
          case "print-preview":
            ui.printPreview = true;
            render();
            break;
          case "print-back":
            ui.printPreview = false;
            ui.pdfNote = "";
            ui.pdfError = false;
            render();
            break;
          case "print-share-pdf":
            sharePdfDocument(ui.reportY, ui.reportM);
            break;
          case "print-window":
            try { window.print(); } catch (err) { /* no-op in some webviews */ }
            break;
          case "profile-save": {
            state.profile.temple = el("pf-temple").value;
            state.profile.name = el("pf-name").value;
            state.profile.daoName = el("pf-daoName").value;
            var radio = document.querySelector('input[name="bao-unit"]:checked');
            if (radio) state.profile.baoUnit = radio.value === "sheng" ? "sheng" : "ben";
            persist();
            ui.profileSaved = true;
            render();
            break;
          }
          case "font-dec": case "font-inc": {
            var lvl = Math.min(4, Math.max(0, state.profile.fontSize + (a === "font-inc" ? 1 : -1)));
            state.profile.fontSize = lvl;
            persist();
            render();
            break;
          }
          case "refl-add": {
            var inp2 = el("refl-new");
            var label = inp2.value.trim();
            if (label === "") break;
            if (label.length > 100) { ui.settingsError = "反省項目名稱請在 100 字以內"; render(); break; }
            var maxId = state.reflectionItems.reduce(function (mx, it) { return Math.max(mx, it.id); }, 0);
            state.reflectionItems.push({ id: maxId + 1, label: label });
            persist();
            render();
            break;
          }
          case "refl-rename": {
            var id = Number(elx.getAttribute("data-id"));
            var rin = el("refl-" + id);
            var nl = rin.value.trim();
            if (nl === "") { ui.settingsError = "反省項目名稱不可空白"; render(); break; }
            state.reflectionItems.forEach(function (it) { if (it.id === id) it.label = nl; });
            persist();
            ui.settingsError = null;
            render();
            break;
          }
          case "refl-del-ask":
            ui.confirmReflRemove = Number(elx.getAttribute("data-id"));
            render();
            break;
          case "refl-del-cancel":
            ui.confirmReflRemove = null;
            render();
            break;
          case "refl-del-confirm": {
            var did = Number(elx.getAttribute("data-id"));
            state.reflectionItems = state.reflectionItems.filter(function (it) { return it.id !== did; });
            ui.confirmReflRemove = null;
            persist();
            render();
            break;
          }
          case "export":
            doExport();
            break;
          case "backup-export": {
            var bslot = autoBackupSlot(elx.getAttribute("data-slot"));
            var bk2 = bslot ? state.autoBackups[bslot.key] : null;
            if (bslot && bk2) {
              downloadBlob(new Blob([bk2.payload], { type: "application/json" }), autoBackupFilename(bslot, bk2));
            }
            break;
          }
          case "import": {
            var f = el("import-file");
            if (f) f.click();
            break;
          }
          case "snap-ask":
            ui.confirmSlot = elx.getAttribute("data-slot");
            render();
            break;
          case "snap-cancel":
            ui.confirmSlot = null;
            render();
            break;
          case "snap-confirm": {
            var slot = elx.getAttribute("data-slot");
            var snap = state.snapshots[slot];
            if (snap) {
              try {
                var parsed = JSON.parse(snap.payload);
                writeSnapshot("latest-undo");
                var st2 = normFullState(parsed);
                state.profile = st2.profile;
                state.entries = st2.entries;
                state.reflectionItems = st2.reflectionItems;
                persist();
                ui.settingsError = null;
              } catch (err) {
                ui.settingsError = "還原失敗";
              }
            }
            ui.confirmSlot = null;
            render();
            break;
          }
        }
      });

      /* ------------------------------------------------------------
         Init
         ------------------------------------------------------------ */
      (function init() {
        loadStore();
        var t = todayLocal();
        ui.viewY = t.y;
        ui.viewM = t.m;
        var prev = new Date(t.y, t.m - 2, 1);
        ui.reportY = prev.getFullYear();
        ui.reportM = prev.getMonth() + 1;
        try {
          localStorage.setItem(STORE_KEY + "__probe", "1");
          localStorage.removeItem(STORE_KEY + "__probe");
        } catch (err) {
          storageOk = false;
        }
        render();
      })();
    </script>
  </body>
</html>
